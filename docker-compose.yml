services:
  db:
    image: postgres:16-alpine
    container_name: 216chan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-216chan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-216chan_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-216chan} -d ${POSTGRES_DB:-216chan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
